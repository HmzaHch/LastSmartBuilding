<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LastSmartBuilding - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #16213e;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #0f3460;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 15px;
        }

        .icon.human { background: #e94560; }
        .icon.temp { background: #ff6b6b; }
        .icon.humidity { background: #4ecdc4; }
        .icon.co { background: #ffe66d; }
        .icon.light { background: #f7fff7; }
        .icon.vibration { background: #ff9f43; }
        .icon.relay { background: #00d4ff; }

        .card-title {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }

        .card-status {
            font-size: 14px;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .status-yes {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .status-no {
            background: #e94560;
            color: #fff;
        }

        .status-clear {
            background: #2ecc71;
            color: #fff;
        }

        .status-critical {
            background: #e74c3c;
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .timestamp {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .relay-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-on {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .btn-on:hover {
            background: #00a8cc;
        }

        .btn-off {
            background: #e94560;
            color: #fff;
        }

        .btn-off:hover {
            background: #c73e54;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .last-update {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #0f3460;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #e94560;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 LastSmartBuilding</h1>
        <p class="subtitle">Zone 1 - Real-time Monitoring Dashboard</p>

        <div id="error-msg" class="error hidden"></div>

        <div class="grid">
            <!-- Human Detection Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon human">👤</div>
                    <div>
                        <div class="card-title">Human Detection</div>
                    </div>
                </div>
                <div class="card-value" id="human-value">
                    <div class="loading"></div>
                </div>
                <div id="human-status" class="card-status">Loading...</div>
                <div class="timestamp" id="human-time">--</div>
            </div>

            <!-- Temperature Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon temp">🌡️</div>
                    <div>
                        <div class="card-title">Temperature</div>
                    </div>
                </div>
                <div class="card-value" id="temp-value">
                    <div class="loading"></div>
                </div>
                <div class="card-status status-clear" id="temp-status">Normal</div>
                <div class="timestamp" id="temp-time">--</div>
            </div>

            <!-- Humidity Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon humidity">💧</div>
                    <div>
                        <div class="card-title">Humidity</div>
                    </div>
                </div>
                <div class="card-value" id="hum-value">
                    <div class="loading"></div>
                </div>
                <div class="card-status status-clear" id="hum-status">Normal</div>
                <div class="timestamp" id="hum-time">--</div>
            </div>

            <!-- CO Level Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon co">☁️</div>
                    <div>
                        <div class="card-title">CO Level</div>
                    </div>
                </div>
                <div class="card-value" id="co-value">
                    <div class="loading"></div>
                </div>
                <div class="card-status status-clear" id="co-status">Safe</div>
                <div class="timestamp" id="co-time">--</div>
            </div>

            <!-- Light Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon light">💡</div>
                    <div>
                        <div class="card-title">Light Level</div>
                    </div>
                </div>
                <div class="card-value" id="light-value">
                    <div class="loading"></div>
                </div>
                <div class="card-status status-clear" id="light-status">Normal</div>
                <div class="timestamp" id="light-time">--</div>
            </div>

            <!-- Vibration Card -->
            <div class="card">
                <div class="card-header">
                    <div class="icon vibration">📳</div>
                    <div>
                        <div class="card-title">Vibration</div>
                    </div>
                </div>
                <div class="card-value" id="vib-value">
                    <div class="loading"></div>
                </div>
                <div class="card-status status-clear" id="vib-status">Stable</div>
                <div class="timestamp" id="vib-time">--</div>
            </div>

            <!-- Relay Control Card -->
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-header">
                    <div class="icon relay">🔌</div>
                    <div>
                        <div class="card-title">Light Control (Relay)</div>
                    </div>
                </div>
                <div class="card-value" id="relay-value">AUTO MODE</div>
                <div class="relay-controls">
                    <button class="btn btn-on" onclick="setRelay('on')">💡 LIGHT ON</button>
                    <button class="btn btn-off" onclick="setRelay('off')">🌑 LIGHT OFF</button>
                    <button class="btn" style="background:#555;color:#fff;" onclick="setRelay('auto')">🔄 AUTO</button>
                </div>
                <div class="timestamp" id="relay-time">Controlled by human detection</div>
            </div>
        </div>

        <div class="last-update">
            Last update: <span id="last-update">--</span> | 
            Refresh: <span id="countdown">3</span>s
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ═══════════════════════════════════════════════════════
        // CONFIG - EDIT WITH YOUR FIREBASE SETTINGS
        // ═══════════════════════════════════════════════════════
                const firebaseConfig = {
        apiKey: "AIzaSyC9GnmZFiDfP63OXSF5Bx4Zmpu9XnCCP7o",
        authDomain: "smartbuilding-88e33.firebaseapp.com",
        databaseURL: "https://smartbuilding-88e33-default-rtdb.firebaseio.com",
        projectId: "smartbuilding-88e33",
        storageBucket: "smartbuilding-88e33.firebasestorage.app",
        messagingSenderId: "412850287325",
        appId: "1:412850287325:web:8e3ad92c97ec5577f2a134",
        measurementId: "G-9MGXM4970W"
        };
        // ═══════════════════════════════════════════════════════

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Relay mode: 'auto' = controlled by detection, 'on'/'off' = manual
        let relayMode = 'auto';

        // Format timestamp
        function formatTime(timestampMs) {
            if (!timestampMs) return '--';
            const date = new Date(timestampMs);
            return date.toLocaleTimeString();
        }

        // Update human detection card
        function updateHuman(data) {
            const valueEl = document.getElementById('human-value');
            const statusEl = document.getElementById('human-status');
            const timeEl = document.getElementById('human-time');

            if (!data) {
                valueEl.textContent = 'No Data';
                statusEl.textContent = 'Unknown';
                statusEl.className = 'card-status';
                return;
            }

            const isHuman = data.human_detected === 'yes';
            const confidence = (data.confidence * 100).toFixed(0);

            valueEl.textContent = isHuman ? `YES (${confidence}%)` : 'NO';
            statusEl.textContent = isHuman ? 'DETECTED' : 'CLEAR';
            statusEl.className = isHuman ? 'card-status status-yes' : 'card-status status-no';
            timeEl.textContent = formatTime(data.timestamp_ms);

            // Auto relay control
            if (relayMode === 'auto') {
                updateRelayDisplay(isHuman ? 'ON (Auto)' : 'OFF (Auto)');
            }
        }

        // Update sensor card
        function updateSensor(id, value, unit, status, statusClass) {
            document.getElementById(`${id}-value`).textContent = value !== null ? `${value}${unit}` : '--';
            const statusEl = document.getElementById(`${id}-status`);
            if (statusEl) {
                statusEl.textContent = status;
                statusEl.className = `card-status ${statusClass}`;
            }
        }

        // Update relay display
        function updateRelayDisplay(state) {
            document.getElementById('relay-value').textContent = state;
        }

        // Manual relay control
        function setRelay(mode) {
            relayMode = mode;
            const relayRef = db.ref('building/zone1/relay_override');
            
            if (mode === 'on') {
                relayRef.set({ state: 'on', timestamp: Date.now(), source: 'web' });
                updateRelayDisplay('ON (Manual)');
            } else if (mode === 'off') {
                relayRef.set({ state: 'off', timestamp: Date.now(), source: 'web' });
                updateRelayDisplay('OFF (Manual)');
            } else {
                relayRef.set({ state: 'auto', timestamp: Date.now(), source: 'web' });
                updateRelayDisplay('AUTO MODE');
            }
        }

        // Show error
        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        // Hide error
        function hideError() {
            document.getElementById('error-msg').classList.add('hidden');
        }

        // Fetch all data
        function fetchData() {
            // Human detection
            db.ref('building/zone1/human_detection').once('value')
                .then(snapshot => updateHuman(snapshot.val()))
                .catch(err => showError('Human detection: ' + err.message));

            // Environmental sensors
            db.ref('building/zone1/environmental').once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        updateSensor('temp', data.temp_c, '°C', data.temp_c > 50 ? 'CRITICAL' : 'Normal', data.temp_c > 50 ? 'status-critical' : 'status-clear');
                        updateSensor('hum', data.hum_pct, '%', 'Normal', 'status-clear');
                        updateSensor('co', data.co_raw, '', data.co_raw > 2000 ? 'DANGER' : 'Safe', data.co_raw > 2000 ? 'status-critical' : 'status-clear');
                        updateSensor('light', data.light_lux, ' lux', 'Normal', 'status-clear');
                        document.getElementById('temp-time').textContent = formatTime(data.timestamp_ms);
                    }
                })
                .catch(err => console.error('Environmental:', err));

            // Structural sensors
            db.ref('building/zone1/structural').once('value')
                .then(snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        updateSensor('vib', data.vibration_g, 'g', data.vibration_g > 2.5 ? 'ALERT' : 'Stable', data.vibration_g > 2.5 ? 'status-critical' : 'status-clear');
                        document.getElementById('vib-time').textContent = formatTime(data.timestamp_ms);
                    }
                })
                .catch(err => console.error('Structural:', err));

            // Update last refresh time
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
            hideError();
        }

        // Countdown timer
        let countdown = 3;
        setInterval(() => {
            countdown--;
            if (countdown <= 0) {
                countdown = 3;
                fetchData();
            }
            document.getElementById('countdown').textContent = countdown;
        }, 1000);

        // Initial fetch
        fetchData();

        // Real-time listener for human detection (instant updates)
        db.ref('building/zone1/human_detection').on('value', snapshot => {
            updateHuman(snapshot.val());
        });
    </script>
</body>
</html>
